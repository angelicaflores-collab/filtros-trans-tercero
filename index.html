<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dibujos que cobran vida · Trans 3º</title><style>body{font-family:system-ui;background:#f6f7fb;color:#192436;margin:0;padding:22px}main{max-width:900px;margin:auto}h1{margin-bottom:5px}p{color:#536074}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0}button,label{border:1px solid #cbd2df;border-radius:10px;background:white;padding:10px 14px;cursor:pointer}button.active{background:#183b66;color:white}.stage{position:relative;width:100%;aspect-ratio:4/3;background:#172334;border-radius:16px;overflow:hidden}video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transform:scaleX(-1)}canvas{pointer-events:none}#status{margin:12px 0;font-weight:600}input{max-width:180px}small{display:block;color:#65718a;margin-top:10px}</style></head><body><main><h1>Dibujos que cobran vida</h1><p>Trans de 3.º · Una experiencia con cámara, sensores digitales y nuestros dibujos.</p><div class="controls"><button id="start">Encender cámara</button><button data-mode="none">Sin filtro</button><button data-mode="face" class="active">Rostro</button><button data-mode="body">Cuerpo</button><label>Subir dibujo PNG <input id="upload" type="file" accept="image/png,image/webp,image/jpeg"></label><label><input id="points" type="checkbox"> Mostrar puntos</label></div><div class="stage"><video id="video" autoplay playsinline muted></video><canvas id="canvas"></canvas></div><div id="status">Presiona «Encender cámara».</div><small>La imagen se procesa en el navegador. Esta versión no guarda fotos ni videos. Necesita HTTPS y conexión a internet para cargar el modelo de detección.</small></main><script type="module">
let FilesetResolver,FaceLandmarker,PoseLandmarker;
const video=document.querySelector('#video'),canvas=document.querySelector('#canvas'),ctx=canvas.getContext('2d'),status=document.querySelector('#status');let mode='face',face,pose,running=false,custom=null,last=0;
const svg=(s)=>{let i=new Image();i.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s);return i};
const antenna=svg(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260"><path d="M135 230 Q85 100 75 60 M265 230 Q315 100 325 60" fill="none" stroke="#673ab7" stroke-width="15" stroke-linecap="round"/><circle cx="75" cy="55" r="42" fill="#ffbf47" stroke="#673ab7" stroke-width="8"/><circle cx="325" cy="55" r="42" fill="#ff6d99" stroke="#673ab7" stroke-width="8"/></svg>`);
const wings=svg(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350"><path d="M300 170 C120 -60 0 10 65 165 C-5 280 175 360 300 185 C425 360 605 280 535 165 C600 10 480 -60 300 170Z" fill="#71cbd5" stroke="#325e9c" stroke-width="12"/><path d="M300 175 Q160 70 90 85 M300 175 Q440 70 510 85" stroke="#fff" stroke-width="14" fill="none"/></svg>`);
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;custom=null;document.querySelector('#upload').value='';document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));});
document.querySelector('#upload').onchange=e=>{let file=e.target.files[0];if(!file)return;let url=URL.createObjectURL(file),img=new Image();img.onload=()=>{custom=img;URL.revokeObjectURL(url)};img.src=url};
function dot(p,color){ctx.fillStyle=color;ctx.beginPath();ctx.arc(p.x*canvas.width,p.y*canvas.height,5,0,Math.PI*2);ctx.fill()}
function place(img,x,y,w,h,angle=0){if(!img.complete||!img.naturalWidth)return;ctx.save();ctx.translate(x,y);ctx.rotate(angle);ctx.drawImage(img,-w/2,-h/2,w,h);ctx.restore()}
async function start(){if(running)return;try{status.textContent='Cargando biblioteca de detección...';if(!FilesetResolver){({FilesetResolver,FaceLandmarker,PoseLandmarker}=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/+esm'));}status.textContent='Cargando los modelos...';const vision=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm');face=await FaceLandmarker.createFromOptions(vision,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',delegate:'CPU'},runningMode:'VIDEO',numFaces:1});pose=await PoseLandmarker.createFromOptions(vision,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task',delegate:'CPU'},runningMode:'VIDEO',numPoses:1});video.srcObject=await navigator.mediaDevices.getUserMedia({video:{width:640,height:480},audio:false});await video.play();canvas.width=video.videoWidth;canvas.height=video.videoHeight;running=true;status.textContent='¡Listo! Prueba a moverte frente a la cámara.';requestAnimationFrame(loop)}catch(e){status.textContent='No se pudo iniciar: '+e.message+' · Comprueba HTTPS, permisos de cámara y conexión.';console.error(e)}}
document.querySelector('#start').onclick=start;
function loop(t){if(!running)return;requestAnimationFrame(loop);if(t-last<70||video.readyState<2)return;last=t;ctx.clearRect(0,0,canvas.width,canvas.height);if(mode==='none')return;const W=canvas.width,H=canvas.height,show=document.querySelector('#points').checked;try{if(mode==='face'){const p=face.detectForVideo(video,t).faceLandmarks?.[0];if(!p)return;const left=p[33],right=p[263],top=p[10];const dist=Math.hypot((right.x-left.x)*W,(right.y-left.y)*H),angle=Math.atan2((right.y-left.y)*H,(right.x-left.x)*W);place(custom||antenna,top.x*W,top.y*H-dist*.45,dist*2.15,dist*1.4,angle);if(show)[left,right,top].forEach(q=>dot(q,'#ffb800'))}else{const p=pose.detectForVideo(video,t).landmarks?.[0];if(!p)return;const a=p[11],b=p[12];if(a.visibility<.5||b.visibility<.5)return;const d=Math.hypot((b.x-a.x)*W,(b.y-a.y)*H),cx=(a.x+b.x)*W/2,cy=(a.y+b.y)*H/2,angle=Math.atan2((b.y-a.y)*H,(b.x-a.x)*W);place(custom||wings,cx,cy+d*.45,d*3.7,d*2.2,angle);if(show)[a,b].forEach(q=>dot(q,'#ffb800'))}}catch(e){console.error(e)}}
</script></body></html>
